[package]
name = "rgbcx"
version = "0.1.1"
edition = "2024"
publish = ["crates-io"]
license = "MPL-2.0"
rust-version = "1.98.1"
description = "BC1, BC3, BC4 and BC5 texture encoding in safe Rust"
readme = "README.md"
repository = "https://github.com/jhq223/rgbcx"
keywords = ["texture", "compression", "bc1", "bc3", "gamedev"]
categories = ["compression", "game-development", "graphics"]

[lints.rust]
unsafe_code = "forbid"

[features]
default = []
parallel = ["dep:rayon"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies]
rayon = { version = "1.12", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "vulkan",
    "metal",
    "wgsl",
], optional = true }
pollster = { version = "1.0.1", optional = true }
bytemuck = { version = "1", optional = true }
