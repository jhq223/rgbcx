name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    outputs:
      published: ${{ steps.registry.outputs.published }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Check tag matches package version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Check whether this version is already published
        id: registry
        shell: bash
        run: |
          metadata="$(cargo metadata --no-deps --format-version 1)"
          name="$(jq -r '.packages[0].name' <<< "$metadata")"
          version="$(jq -r '.packages[0].version' <<< "$metadata")"
          status="$(curl --silent --show-error --retry 3 --connect-timeout 15 --max-time 60 \
            --user-agent "cargo-release-check/$name" \
            --output "$RUNNER_TEMP/registry-version.json" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/$name/$version")"
          case "$status" in
            200)
              jq -e --arg version "$version" '.version.num == $version' "$RUNNER_TEMP/registry-version.json" > /dev/null
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$name $version is already published; skipping upload."
              ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $status" >&2; exit 1 ;;
          esac
      - name: Check package before publishing
        if: steps.registry.outputs.published == 'false'
        run: cargo publish --dry-run
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [version, checks]
    if: needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    # Trusted Publisher must match this repository, release.yml and crates-io.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Obtain a short-lived crates.io token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
